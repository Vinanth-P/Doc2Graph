[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2graph"
version = "1.0.0"
description = "Knowledge Graph Builder from Documents — Classical ML Edition"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Doc2Graph Team"}
]
keywords = ["knowledge-graph", "nlp", "neo4j", "fastapi", "d3"]
dependencies = [
    "spacy>=3.7,<4.0",
    "rapidfuzz>=3.9.0",
    "scikit-learn>=1.4.0",
    "nltk>=3.8.0",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "langdetect>=1.0.9",
    "neo4j>=5.20.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "filelock>=3.14.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[neo4j]>=4.7.0",
    "httpx>=0.27.0",
]
full = [
    "pytesseract>=0.3.10",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[neo4j]>=4.7.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

