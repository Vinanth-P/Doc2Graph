services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-u", "neo4j",
          "-p", "${NEO4J_PASSWORD}",
          "RETURN 1",
        ]
      interval: 10s
      retries: 12
      start_period: 45s

  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687   # container-network hostname
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data             # persist processed docs + job store
      # models/ is NOT mounted — baked into image at build time
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]    # remove if no NVIDIA Container Toolkit

volumes:
  neo4j_data:
  neo4j_logs:
